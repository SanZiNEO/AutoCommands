buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'com.guardsquare:proguard-gradle:7.4.2'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base { archivesName = mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories { mavenCentral() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// ProGuard 混淆任务（手动执行：gradlew releaseJar）
task obfuscateJar(type: proguard.gradle.ProGuardTask) {
    group 'build'
    description '使用 ProGuard 混淆 JAR 文件'
    dependsOn tasks.jar

    // 声明输入，避免改代码后误判 UP-TO-DATE 导致混淆产物不更新
    inputs.file tasks.jar.archiveFile
    inputs.file file('proguard-rules.pro')

    def outputFile = file("${project.buildDir}/libs/${mod_id}-${mod_version}-release.jar")
    outputs.file outputFile

    doFirst {
        configuration files('proguard-rules.pro')
        injars "${tasks.jar.archiveFile.get()}"
        outjars "${outputFile}"

        def libraryJars = [] as Set
        // JDK 类库（JDK 9+ 没有 rt.jar，用 java.base.jmod / java.desktop.jmod）
        def javaHome = System.getProperty('java.home')
        def baseJmod = new File(javaHome, 'jmods/java.base.jmod')
        if (baseJmod.exists()) {
            libraryJars << baseJmod
        }
        def desktopJmod = new File(javaHome, 'jmods/java.desktop.jmod')
        if (desktopJmod.exists()) {
            libraryJars << desktopJmod
        }
        // 核心库必须用 srg 名版本：reobfJar 输出的模组 jar 引用 srg 名，
        // 与 notch/mapped 名不匹配会导致覆写关系识别失败（覆写方法被误混淆、运行时崩溃）
        def srgJars = fileTree("${System.getProperty('user.home')}/.gradle/caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge")
                .include('**/forge-*-srg.jar')
                .files
        def srgJar = srgJars.find { it.exists() }
        if (srgJar != null) {
            libraryJars << srgJar
        }
        configurations.compileClasspath.files.each { if (it.name.endsWith('.jar') && !it.name.contains('forge') && !it.name.contains('minecraft')) libraryJars << it }
        configurations.runtimeClasspath.files.each { if (it.name.endsWith('.jar') && !it.name.contains('forge') && !it.name.contains('minecraft')) libraryJars << it }
        libraryjars libraryJars as List
    }
}

// 发布构建任务
task releaseJar(type: Task) {
    group 'build'
    description '构建并混淆发布版本的 JAR 文件'
    dependsOn tasks.jar
    finalizedBy tasks.obfuscateJar
    doFirst { project.ext.set('release', true) }
}

// 编译配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.hasProperty('release')) {
        options.compilerArgs.add('-g:none')
    }
}
